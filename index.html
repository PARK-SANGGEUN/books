<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>시너지 밴드의 서재 v1.</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Pretendard:wght@400;700;900&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  background:linear-gradient(180deg,#0f1b2c,#182b44,#203b59);
  color:white;
}

/* 제목 */
h1{
  text-align:center;
  padding:22px 10px 14px;
  font-size:36px;
  font-weight:900;
  letter-spacing:1.5px;
  font-family:"Playfair Display",serif;
  color:#ffd369;
  text-shadow:0 4px 14px rgba(0,0,0,.7);
}

/* 구역제목 */
.section-title{
  max-width:1200px;
  margin:14px auto 0;
  font-size:18px;
  font-weight:900;
  color:#ffebc2;
}

/* 전체 책장 박스 */
.shelf{
  max-width:1200px;
  margin:12px auto 30px;
  padding:26px 20px;
  border-radius:18px;
  background:linear-gradient(135deg,#7b5a2d,#5e431f,#8a6333);
  box-shadow:
    inset 0 0 40px rgba(0,0,0,.45),
    0 12px 26px rgba(0,0,0,.55);
  position:relative;
}

/* 칸막이(세로 구분) */
.divider{
  position:absolute;
  top:25px;
  bottom:25px;
  width:10px;
  background:linear-gradient(90deg,#4a3014,#8a6333);
  box-shadow:inset -3px 0 6px rgba(0,0,0,.7);
}

/* 왼쪽과 오른쪽 입체 옆면 */
.shelf::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:-18px;
  width:18px;
  background:linear-gradient(180deg,#2b1a09,#725027);
}
.shelf::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  right:-18px;
  width:18px;
  background:linear-gradient(180deg,#2b1a09,#725027);
}

/* 책 자리 */
.books{
  display:grid;
  grid-template-columns: repeat(3,1fr);
  gap:32px;
  padding:20px 15px;
}

/* ===== 책 (3D) ===== */
.book{
  position:relative;
  height:200px;
  cursor:pointer;
  transform:rotate(-2deg);
  transition:.35s;
  perspective:800px;
}

/* 책 표지 */
.cover{
  width:100%;
  height:100%;
  background:white;
  border-radius:6px;
  overflow:hidden;
  transform:rotateY(-6deg);
  box-shadow:
    6px 10px 20px rgba(0,0,0,.55),
    inset -6px 0 14px rgba(0,0,0,.35);
}

/* 표지 이미지 */
.cover img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:white;
  padding:6px;
}

/* 책 옆면 (두께) */
.cover::after{
  content:"";
  position:absolute;
  top:6px;
  bottom:6px;
  right:-12px;
  width:12px;
  border-radius:0 6px 6px 0;
  background:repeating-linear-gradient(
    90deg,#eee,#ddd 2px,#ccc 3px,#ddd 4px
  );
  box-shadow: inset 2px 0 4px rgba(0,0,0,.35);
}

/* Hover 효과 */
.book:hover{
  transform:rotate(0deg) scale(1.05);
}
.book:hover .cover{
  transform:rotateY(-2deg);
}

/* COMING SOON 책 */
.coming{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:18px;
  color:#555;
  background:repeating-linear-gradient(
    45deg,#f8e7c7,#f2d8aa 12px,#e8cfa1 12px,#e1c28f 24px
  );
}

/* 반응형 */
@media(max-width:900px){
  .books{ grid-template-columns:repeat(2,1fr);}
}
@media(max-width:600px){
  .books{ grid-template-columns:1fr;}
}

</style>
</head>

<body>

<h1>📚 시너지 밴드의 서재 v1.</h1>

<!-- 1층 : 대입 자료 -->
<div class="section-title">🎓 대입 자료</div>
<div class="shelf">
  <div class="books">

      <div class="cover"><img src="신입생선발면접1.png"></div>
    </a>

    <a class="book" href="https://drive.google.com/file/d/1DS72JzaT6wmgE6mCB-_-mWOOjm8QqXym/view" target="_blank">
      <div class="cover"><img src="신입생선발면접2.png"></div>
    </a>

    <div class="book"><div class="cover coming">COMING SOON</div></div>

</div>

<!-- 3층 : 탐구 활동 자료 -->
<div class="section-title">🔍 탐구 활동 자료</div>
<div class="shelf">
  <div class="books">

</body>
