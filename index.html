<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>시너지 밴드의 서재 v1.</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Pretendard:wght@400;700;900&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
  background:linear-gradient(180deg,#eef6ff,#f9fbff,#ffffff);
}

/* 제목 */
h1{
  text-align:center;
  padding:22px 10px 14px;
  font-size:36px;
  font-weight:900;
  font-family:"Playfair Display",serif;
  color:#1c3c84;
  text-shadow:0 4px 12px rgba(0,0,0,.25);
}

/* 구역제목 */
.section-title{
  max-width:1200px;
  margin:14px auto 0;
  font-size:18px;
  font-weight:900;
  color:#333;
}

/* 책장 */
.shelf{
  max-width:1200px;
  margin:12px auto 30px;
  padding:26px 20px;
  border-radius:18px;
  background:linear-gradient(135deg,#d9c3a2,#e8d2af,#d3b58b);
  box-shadow:inset 0 0 25px rgba(0,0,0,.25),0 12px 24px rgba(0,0,0,.35);
  position:relative;
}

/* 책 그리드 */
.books{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px;
  padding:10px;
}

/* 책 */
.book{
  position:relative;
  height:200px;
  transform:rotate(-2deg);
  transition:.35s;
  perspective:700px;
}

/* 표지 */
.cover{
  width:100%;
  height:100%;
  background:white;
  border-radius:14px;
  border:2px solid rgba(255,255,255,.7);
  overflow:hidden;
  transform:rotateY(-5deg);
  box-shadow:8px 12px 22px rgba(0,0,0,.4);
  position:relative;
}

/* 표지 이미지 */
.cover img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:white;
  padding:3%;
  image-rendering:-webkit-optimize-contrast;
}

/* 책 옆면 */
.cover::after{
  content:"";
  position:absolute;
  top:8px;
  bottom:8px;
  right:-12px;
  width:12px;
  background:repeating-linear-gradient(90deg,#eee,#ddd 2px,#ccc 3px,#ddd 4px);
  border-radius:0 10px 10px 0;
  box-shadow:inset 2px 0 5px rgba(0,0,0,.25);
}

/* hover */
.book:hover{
  transform:rotate(0deg) scale(1.05);
}
.book:hover .cover{ transform:rotateY(-2deg); }

/* 🔥 표지 위 제목 자동 Overlay */
.title-overlay{
  position:absolute;
  bottom:6px;
  left:6px;
  right:6px;
  padding:6px 10px;
  font-size:13px;
  font-weight:900;
  color:#ffffff;
  text-shadow:0 2px 6px rgba(0,0,0,.6);
  background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.25));
  border-radius:10px;
  backdrop-filter:blur(2px);
}

/* COMING SOON */
.coming{
  font-weight:900;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:repeating-linear-gradient(45deg,#f9e9cc,#f3d9aa 12px,#f0d29a 24px);
}

/* 반응형 */
@media(max-width:900px){ .books{grid-template-columns:repeat(2,1fr);} }
@media(max-width:600px){ .books{grid-template-columns:1fr;} }

</style>
</head>

<body>
